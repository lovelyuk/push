<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>웹 테트리스</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="layout">
    <section class="playfield">
      <canvas id="tetris" width="300" height="600" aria-label="테트리스 게임 화면"></canvas>
      <div id="overlay" class="overlay hidden" role="alert">
        <p id="overlay-message">게임 종료</p>
        <button id="restart" type="button" class="button">다시 시작</button>
      </div>
    </section>
    <aside class="info-panel">
      <h1>테트리스</h1>
      <div class="stat">
        <span class="label">점수</span>
        <span id="score" class="value">0</span>
      </div>
      <div class="stat">
        <span class="label">레벨</span>
        <span id="level" class="value">1</span>
      </div>
      <div class="stat">
        <span class="label">지운 줄</span>
        <span id="lines" class="value">0</span>
      </div>
      <section class="next-wrapper">
        <h2>다음 블록</h2>
        <ul id="next-pieces" class="queue" aria-label="다음에 등장할 블록 목록"></ul>
      </section>
      <section class="instructions">
        <h2>조작법</h2>
        <ul>
          <li><kbd>←</kbd>/<kbd>→</kbd>: 좌우 이동</li>
          <li><kbd>↓</kbd>: 빠르게 내리기</li>
          <li><kbd>Space</kbd>: 하드 드롭</li>
          <li><kbd>Q</kbd>/<kbd>E</kbd> 또는 <kbd>↑</kbd>: 회전</li>
        </ul>
      </section>
    </aside>
  </main>
  <script src="script.js"></script>
</body>
</html>
